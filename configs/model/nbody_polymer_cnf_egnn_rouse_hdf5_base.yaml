experiment:
  family: nbody_cnf
  seed: 0

runtime:
  use_gpu: true

data:
  kind: rouse_hdf5
  dim: 2
  n_atoms: 32
  n_samples: 16000
  burn_in: 0
  source_pattern: traj_seed*.h5
  allow_partial: false
  center: true
  normalize: true
  normalization_mode: scalar
  normalization_eps: 1.0e-6

model:
  name: cnf_egnn
  kind: egnn
  equivariant: true
  node_embedding_dim: 8
  egnn_layers: 3
  hidden_dims: [64, 64, 64]
  trace: fd_hutchinson

ode:
  t0: 0.0
  t1: 1.0
  abstol: 3.0e-4
  reltol: 3.0e-4

training:
  epochs: 60
  batch_size: 64
  learning_rate: 1.0e-3
  log_every: 16
  checkpoint_every: 1

sampling:
  n_samples: 1000

output:
  dir: runs
  plots: true
