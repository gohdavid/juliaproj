experiment:
  family: nbody_cnf
  name: nbody_mlp_static
  seed: 0

runtime:
  use_gpu: true

data:
  kind: static_asymmetric
  dim: 2
  n_atoms: 10
  n_samples: 4000
  burn_in: 0
  noise_std: 0.1

model:
  kind: mlp
  hidden_dims: [64, 64, 64]
  trace: hutchinson

ode:
  t0: 0.0
  t1: 1.0
  abstol: 1.0e-5
  reltol: 1.0e-5

training:
  epochs: 10
  batch_size: 64
  learning_rate: 5.0e-3

sampling:
  n_samples: 1000

output:
  dir: runs
  plots: true
