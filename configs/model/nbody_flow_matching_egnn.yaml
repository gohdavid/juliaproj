experiment:
  family: nbody_flow_matching
  name: nbody_flow_matching_egnn_static
  seed: 0

runtime:
  use_gpu: true

data:
  kind: static_asymmetric
  dim: 2
  n_atoms: 10
  n_samples: 4000
  burn_in: 0
  noise_std: 0.1
  center: true

model:
  name: flow_matching_egnn
  equivariant: true
  hidden_dims: [64, 64, 64]

training:
  epochs: 60
  batch_size: 64
  learning_rate: 1.0e-3
  log_every: 16
  checkpoint_every: 1

sampling:
  n_samples: 1000
  steps: 64

output:
  dir: runs
  plots: true
