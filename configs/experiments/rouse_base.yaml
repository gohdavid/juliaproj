seed: 0

parallel:
  workers: 16
  seed_stride: 1
  julia_num_threads: 1
  log_dir: logs/rouse_base

logging:
  progress: true
  progress_steps: 1000000

rouse:
  dim: 2
  n_beads: 32
  diffusion: 1.0
  bond_length: 1.0
  k_over_xi: 3.0

nonideal:
  lennard_jones:
    enabled: false
    epsilon: 0.04
    sigma: 0.85
    softening: 0.5
    cutoff: 2.0
    exclude_bonded: true
    shift: true
  excluded_volume:
    enabled: false
    epsilon: 0.03
    sigma: 1.0
    softening: 0.3
    power: 12.0
    cutoff: 1.5
    exclude_bonded: true
  confinement:
    enabled: false
    strength: 0.02
    centered: true
  hairpin_lj:
    enabled: false
    epsilon: 5.0
    sigma: 0.9
    softening: 0.3
    cutoff: 3.0
    shift: true
    min_separation: 2
  ring_lj:
    enabled: false
    epsilon: 5.0
    sigma: 0.9
    softening: 0.2
    cutoff: 2.5
    shift: true
  ring_bond:
    enabled: false

solver:
  algorithm: SOSRA2
  dt: 0.0005
  adaptive: false

save:
  burn_in_tau: 20.0
  until_tau: 99.9
  interval_tau: 0.1
  write_hdf5: true
  write_jls: false

output:
  dir: outputs
  experiment_name: rouse_base
  file: traj.jls
  hdf5_file: trajectories/traj.h5
