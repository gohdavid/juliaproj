experiment:
  family: nbody_diffusion
  name: nbody_diffusion_egnn_static
  seed: 0

runtime:
  use_gpu: true

data:
  kind: static_asymmetric
  dim: 2
  n_atoms: 10
  n_samples: 4000
  burn_in: 0
  noise_std: 0.1
  center: true

model:
  name: diffusion_egnn
  equivariant: true
  hidden_dims: [64, 64, 64]

diffusion:
  objective: score_matching
  steps: 100
  beta_start: 1.0e-4
  beta_end: 2.0e-2

training:
  epochs: 30
  batch_size: 64
  learning_rate: 1.0e-3
  log_every: 1
  checkpoint_every: 5

sampling:
  n_samples: 1000

output:
  dir: runs
  plots: true
