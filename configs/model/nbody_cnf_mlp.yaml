experiment:
  family: nbody_cnf
  name: nbody_cnf_mlp_static
  seed: 0

runtime:
  use_gpu: true

data:
  kind: static_asymmetric
  dim: 2
  n_atoms: 10
  n_samples: 4000
  burn_in: 0
  noise_std: 0.1

model:
  name: cnf_mlp
  kind: mlp
  equivariant: false
  hidden_dims: [256, 256, 256]
  trace: hutchinson

ode:
  t0: 0.0
  t1: 1.0
  abstol: 1.0e-5
  reltol: 1.0e-5

training:
  epochs: 60
  batch_size: 64
  learning_rate: 1.0e-3
  log_every: 16
  checkpoint_every: 1

sampling:
  n_samples: 1000

output:
  dir: runs
  plots: true
