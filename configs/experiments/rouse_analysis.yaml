seed: 0

parallel:
  workers: 32
  seed_stride: 1
  julia_num_threads: 1
  log_dir: logs

logging:
  progress: true
  progress_steps: 1000000

rouse:
  dim: 2
  n_beads: 32
  diffusion: 1.0
  bond_length: 1.0
  k_over_xi: 3.0

nonideal:
  lennard_jones:
    enabled: false
    epsilon: 0.05
    sigma: 1.0
    softening: 0.4
    cutoff: 2.5
    exclude_bonded: true
    shift: true
  excluded_volume:
    enabled: false
    epsilon: 0.02
    sigma: 1.0
    softening: 0.4
    power: 12.0
    cutoff: 2.5
    exclude_bonded: true
  confinement:
    enabled: false
    strength: 0.001
    centered: false

solver:
  algorithm: SOSRA
  dt: 0.001

save:
  burn_in_tau: 20.0
  until_tau: 10000.0
  interval_tau: 2.0

output:
  dir: outputs
  experiment_name: rouse_raw
  file: rouse_analysis.jls
  hdf5_file: rouse_analysis.h5
