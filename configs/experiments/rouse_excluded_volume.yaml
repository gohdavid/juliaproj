seed: 22

rouse:
  dim: 2
  n_beads: 32
  diffusion: 1.0
  bond_length: 1.0
  k_over_xi: 3.0

nonideal:
  lennard_jones:
    enabled: false
    epsilon: 0.05
    sigma: 1.0
    softening: 0.4
    cutoff: 2.5
    exclude_bonded: true
    shift: true
  excluded_volume:
    enabled: true
    epsilon: 0.01
    sigma: 0.8
    softening: 0.4
    power: 12.0
    cutoff: 2.0
    exclude_bonded: true
  confinement:
    enabled: false
    strength: 0.001
    centered: false

solver:
  algorithm: EM
  dt: 0.0005

save:
  burn_in_tau: 20.0
  until_tau: 200.0
  interval_tau: 2.0
  write_hdf5: true
  write_jls: false

output:
  dir: outputs
  experiment_name: rouse_excluded_volume
  file: rouse_analysis.jls
  hdf5_file: trajectories/rouse_analysis.h5
