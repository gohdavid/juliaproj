experiment:
  family: nbody_diffusion
  name: nbody_polymer_diffusion_egnn_rouse_hdf5
  seed: 0

runtime:
  use_gpu: true

data:
  kind: rouse_hdf5
  dim: 2
  n_atoms: 32
  n_samples: 32000
  burn_in: 0
  source_dir: /home/rsmukk/data/18337/juliaproj/outputs/rouse_base/400cf3f38543/trajectories
  source_pattern: traj_seed*.h5
  allow_partial: false
  physics_params: [1.0, 1.0, 3.0]
  center: true

model:
  name: diffusion_egnn
  equivariant: true
  node_embedding_dim: 16
  hidden_dims: [128, 128, 128]

training:
  epochs: 50
  batch_size: 256
  learning_rate: 1.0e-4
  log_every: 20
  checkpoint_every: 10

sampling:
  n_samples: 1000
  steps: 1000

output:
  dir: runs
  plots: true
