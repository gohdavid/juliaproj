experiment:
  family: nbody_diffusion
  name: nbody_polymer_diffusion_egnn_rouse_hdf5
  seed: 0

runtime:
  use_gpu: true

data:
  kind: rouse_hdf5
  dim: 2
  n_atoms: 32
  n_samples: 4000
  burn_in: 0
  source_dir: outputs/rouse_base/400cf3f38543/trajectories
  source_pattern: traj_seed*.h5
  allow_partial: false
  physics_params: [1.0, 1.0, 3.0]
  center: true

model:
  name: diffusion_egnn
  equivariant: true
  node_embedding_dim: 8
  hidden_dims: [64, 64, 64]

training:
  epochs: 100
  batch_size: 64
  learning_rate: 5e-3
  log_every: 1
  checkpoint_every: 10

sampling:
  n_samples: 1000
  steps: 1000

output:
  dir: runs
  plots: true
