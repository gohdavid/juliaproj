seed: 11

rouse:
  dim: 2
  n_beads: 32
  diffusion: 1.0
  bond_length: 1.0
  k_over_xi: 3.0

nonideal:
  lennard_jones:
    enabled: false
    epsilon: 0.05
    sigma: 1.0
    softening: 0.4
    cutoff: 2.5
    exclude_bonded: true
    shift: true
  excluded_volume:
    enabled: false
    epsilon: 0.02
    sigma: 1.0
    softening: 0.4
    power: 12.0
    cutoff: 2.5
    exclude_bonded: true
  confinement:
    enabled: false
    strength: 0.001
    centered: false

solver:
  dt: 0.01

save:
  burn_in_tau: 0.0
  until_tau: 5.0
  interval_tau: 0.05

output:
  dir: outputs
  experiment_name: rouse_video
  file: rouse_video.jls
  hdf5_file: trajectories/rouse_video.h5
