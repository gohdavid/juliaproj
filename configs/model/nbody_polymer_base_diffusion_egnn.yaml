experiment:
  family: nbody_diffusion
  name: nbody_polymer_diffusion_egnn_rouse_base
  seed: 0

runtime:
  use_gpu: true

data:
  kind: rouse_hdf5
  dim: 2
  n_atoms: 32
  n_samples: 16000
  burn_in: 0
  source_dir: /home/rsmukk/data/18337/juliaproj/outputs/rouse_base/f5ecf974b2a8/trajectories
  source_pattern: traj_seed*.h5
  allow_partial: false
  physics_params: [0.25, 1.0, 3.0]
  center: true
  normalize: true
  normalization_mode: scalar
  normalization_eps: 1.0e-6

model:
  name: diffusion_egnn
  equivariant: true
  node_embedding_dim: 8
  egnn_layers: 3
  hidden_dims: [256, 256, 256]

training:
  epochs: 60
  batch_size: 128
  learning_rate: 5.0e-5
  gpu_data: true
  log_every: 50
  checkpoint_every: 10

sampling:
  n_samples: 1000
  steps: 1000

output:
  dir: runs
  plots: true
