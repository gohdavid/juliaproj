experiment:
  family: nbody_flow_matching
  name: nbody_equivariant_fm_static
  seed: 0

runtime:
  use_gpu: true

data:
  kind: static_asymmetric
  dim: 2
  n_atoms: 10
  n_samples: 4000
  burn_in: 0
  noise_std: 0.1
  center: true

model:
  hidden_dims: [64, 64, 64]

training:
  epochs: 30
  batch_size: 64
  learning_rate: 1.0e-3

sampling:
  n_samples: 1000
  steps: 64

output:
  dir: runs
  plots: true
