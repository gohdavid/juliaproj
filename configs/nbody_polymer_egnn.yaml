experiment:
  family: nbody_cnf
  name: nbody_egnn_rouse_hdf5
  seed: 0

runtime:
  use_gpu: true

data:
  kind: rouse_hdf5
  dim: 2
  n_atoms: 32
  n_samples: 4000
  burn_in: 0
  source_dir: outputs/rouse_raw/199149bbf939
  source_pattern: rouse_analysis_seed*.h5
  allow_partial: false
  physics_params: [1.0, 1.0, 3.0]
  center: true

model:
  kind: egnn
  hidden_dims: [64, 64, 64]
  trace: exact

ode:
  t0: 0.0
  t1: 1.0
  abstol: 1.0e-5
  reltol: 1.0e-5

training:
  epochs: 30
  batch_size: 64
  learning_rate: 1.0e-3

sampling:
  n_samples: 1000

output:
  dir: runs
  plots: true
