experiment:
  family: nbody_cnf
  name: nbody_polymer_ring_lj_cnf_egnn_rouse_hdf5
  seed: 0

runtime:
  use_gpu: true

data:
  kind: rouse_hdf5
  dim: 2
  n_atoms: 32
  n_samples: 16000
  burn_in: 0
  source_dir: /orcd/scratch/orcd/006/davidgoh/juliaproj/outputs/rouse_ring_lj/3137589d068f/trajectories
  source_pattern: traj_seed*.h5
  allow_partial: false
  physics_params: [1.0, 1.0, 3.0, 0.0, 0.04, 0.85, 0.5, 2.0, 1.0, 1.0, 1.0, 0.05, 1.0, 0.25, 12.0, 1.5, 1.0, 1.0, 0.05, 1.0, 0.0, 2.5, 0.9, 0.3, 3.0, 1.0, 2.0, 2.0, 1.0, 0.02, 1.0, 5.0, 0.9, 0.2, 2.5, 1.0]
  center: true

model:
  name: cnf_egnn
  kind: egnn
  equivariant: true
  node_embedding_dim: 8
  hidden_dims: [64, 64, 64]
  trace: exact

ode:
  t0: 0.0
  t1: 1.0
  abstol: 1.0e-4
  reltol: 1.0e-4

training:
  epochs: 60
  batch_size: 64
  learning_rate: 5.0e-5
  log_every: 16
  checkpoint_every: 5

sampling:
  n_samples: 1000

output:
  dir: runs
  plots: true
