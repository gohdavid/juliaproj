experiment:
  family: nbody_cnf
  name: nbody_cnf_egnn_rouse_hdf5
  seed: 0

runtime:
  use_gpu: true

data:
  kind: rouse_hdf5
  dim: 2
  n_atoms: 32
  n_samples: 0
  burn_in: 0
  source_dir: /orcd/scratch/orcd/006/davidgoh/juliaproj/outputs/rouse_base/e6a343e8490d/trajectories
  source_pattern: traj_seed*.h5
  allow_partial: false
  physics_params: [1.0, 1.0, 3.0]
  center: true
  normalize: true
  normalization_mode: scalar
  normalization_eps: 1.0e-6

model:
  name: cnf_egnn
  kind: egnn
  equivariant: true
  egnn_layers: 3
  hidden_dims: [128, 128, 128]
  trace: fd_hutchinson

ode:
  t0: 0.0
  t1: 1.0
  abstol: 1.0e-5
  reltol: 1.0e-5

training:
  epochs: 60
  batch_size: 64
  learning_rate: 1.0e-3
  log_every: 16
  checkpoint_every: 1

sampling:
  n_samples: 1000

output:
  dir: runs
  plots: true
