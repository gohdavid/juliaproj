seed: 23

rouse:
  dim: 2
  n_beads: 32
  diffusion: 1.0
  bond_length: 1.0
  k_over_xi: 3.0

nonideal:
  lennard_jones:
    enabled: false
    epsilon: 0.05
    sigma: 1.0
    softening: 0.4
    cutoff: 2.5
    exclude_bonded: true
    shift: true
  excluded_volume:
    enabled: false
    epsilon: 0.02
    sigma: 1.0
    softening: 0.4
    power: 12.0
    cutoff: 2.5
    exclude_bonded: true
  confinement:
    enabled: true
    strength: 0.02
    centered: true

solver:
  algorithm: EM
  dt: 0.0005

save:
  burn_in_tau: 0.0
  until_tau: 5.0
  interval_tau: 0.01
  write_hdf5: true
  write_jls: false

output:
  dir: outputs
  experiment_name: rouse_confinement_video
  file: traj.jls
  hdf5_file: trajectories/traj.h5
