seed: 22

parallel:
  workers: 16
  seed_stride: 1
  julia_num_threads: 1
  log_dir: logs/rouse_excluded_volume

rouse:
  dim: 2
  n_beads: 32
  diffusion: 1.0
  bond_length: 1.0
  k_over_xi: 3.0

nonideal:
  lennard_jones:
    enabled: false
    epsilon: 0.05
    sigma: 1.0
    softening: 0.4
    cutoff: 2.5
    exclude_bonded: true
    shift: true
  excluded_volume:
    enabled: true
    epsilon: 0.03
    sigma: 1.0
    softening: 0.3
    power: 12.0
    cutoff: 1.5
    exclude_bonded: true
  confinement:
    enabled: false
    strength: 0.001
    centered: false

solver:
  algorithm: EM
  dt: 0.0005

save:
  burn_in_tau: 20.0
  until_tau: 99.9
  interval_tau: 0.1
  write_hdf5: true
  write_jls: false

output:
  dir: outputs
  experiment_name: rouse_excluded_volume
  file: traj.jls
  hdf5_file: trajectories/traj.h5
